<div class="form-container">
  <h2>{{ isEdit ? 'Edit' : 'Add' }} Stock Transfer Item</h2>
  <form (ngSubmit)="save()">
    <div class="form-group">
      <label for="product">Product</label>
      <select id="product" [(ngModel)]="item.productId" name="productId" required>
        <option [value]="0" disabled>Select Product</option>
        <option *ngFor="let product of products" [value]="product.id">
          {{ product.name }} ({{ product.sku }})
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" [(ngModel)]="item.quantity" name="quantity" required min="1" />
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="!item.productId || item.quantity <= 0" class="btn-save">Save</button>
      <button type="button" (click)="cancel()" class="btn-cancel">Cancel</button>
    </div>
  </form>
</div>
