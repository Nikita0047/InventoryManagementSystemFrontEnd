<p>user-list works!</p>
<div *ngIf="IsLoaded">Loading users...</div>
<div *ngIf="error" class="error">{{ error }}</div>
<table *ngIf="!IsLoaded && !error">
    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>role</th>
            <th>Permission</th>
            <th>Created At</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let user of users">
            <td>{{ user.fullName }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.role }}</td>
            <td>{{ user.permissions}}</td>
            <td>{{ user.createdAt | date }}</td>
            <td>
                <button (click)="deleteUser(user.id)">Delete</button>
            </td>
        </tr>
    </tbody>
</table>
